[project]
name = "flado"
version = "0.1.0"
description = "Flask todo app"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "Flask==3.1.2",
    "SQLAlchemy>=2.0.36",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.5",
    "python-dotenv==1.0.0",
    "Werkzeug==3.1.0",
    "gunicorn>=21.2.0",
    "Flask-WTF>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
